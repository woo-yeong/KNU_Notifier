name: Monitor Cloudflare Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Worker health
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://knu-notice-discord-notifier.wooyeong.workers.dev/health"

          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            "$HEALTH_URL")"

          echo "Health response: $response"

          python3 - "$response" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          data = json.loads(sys.argv[1])

          if data.get("ok") is not True:
              raise SystemExit("Worker health returned ok=false")

          last_success = data.get("lastSuccess")
          if not last_success:
              raise SystemExit("lastSuccess is missing")

          updated_at = last_success.get("updated_at")
          if not updated_at:
              raise SystemExit("updated_at is missing")

          last_time = datetime.fromisoformat(
              updated_at.replace("Z", "+00:00")
          )
          now = datetime.now(timezone.utc)
          age_minutes = (now - last_time).total_seconds() / 60

          print(f"Last successful collection: {age_minutes:.1f} minutes ago")

          if age_minutes > 45:
              raise SystemExit(
                  f"Worker has not completed successfully for "
                  f"{age_minutes:.1f} minutes"
              )

          expected_sources = {
              "notice",
              "employment",
              "career_notice",
          }
          sources = data.get("sources") or {}
          missing_sources = expected_sources - set(sources)
          if missing_sources:
              raise SystemExit(
                  f"Missing board health records: {sorted(missing_sources)}"
              )

          for source in sorted(expected_sources):
              source_time = datetime.fromisoformat(
                  sources[source].replace("Z", "+00:00")
              )
              source_age = (now - source_time).total_seconds() / 60
              print(f"{source}: last success {source_age:.1f} minutes ago")
              if source_age > 20:
                  raise SystemExit(
                      f"{source} has not completed successfully for "
                      f"{source_age:.1f} minutes"
                  )
          PY