name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate all Worker configurations
        run: npm run check:all

      - name: Deploy all Workers
        run: npm run deploy:all

      - name: Verify all collectors are fresh
        env:
          HEALTH_URL: https://knu-notice-discord-notifier.wooyeong.workers.dev/health
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          expected = {
              "notice",
              "employment",
              "career_notice",
              "field_training",
              "ai_notice",
          }
          url = os.environ["HEALTH_URL"]
          last_error = None

          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "KNU-Notifier-GitHub-Actions/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)

                  sources = payload.get("sources", {})
                  missing = expected - sources.keys()
                  stale = {}
                  now = datetime.now(timezone.utc)

                  for source in expected & sources.keys():
                      updated = datetime.fromisoformat(
                          sources[source].replace("Z", "+00:00")
                      )
                      age_seconds = (now - updated).total_seconds()
                      if age_seconds > 180:
                          stale[source] = round(age_seconds / 60, 1)

                  if not missing and not stale:
                      print("All five collectors are fresh:", json.dumps(sources))
                      break

                  last_error = f"missing={sorted(missing)}, stale_minutes={stale}"
              except Exception as error:
                  last_error = repr(error)

              print(f"Verification attempt {attempt}/6 failed: {last_error}")
              if attempt < 6:
                  time.sleep(15)
          else:
              raise SystemExit(f"Worker verification failed: {last_error}")
          PY
